[package]
name = "ait-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ait-contracts = { path = "../../crates/contracts" }
ait-ipc = { path = "../../crates/ipc" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
ait-project-local = { path = "../../crates/project-local" }
ait-api-http = { path = "../../crates/api-http" }
ait-application = { path = "../../crates/application" }
ait-domain = { path = "../../crates/domain" }
ait-ports = { path = "../../crates/ports" }
ait-storage-sqlite = { path = "../../crates/storage-sqlite" }
async-trait = "0.1"
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["net", "process", "sync", "time"] }

[lints]
workspace = true
