[package]
name = "ait-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
dev-mock-provider = [
    "ait-contracts/dev-mock-provider",
    "ait-domain/dev-mock-provider",
    "ait-api-http/dev-mock-provider",
]

[dependencies]
ait-contracts = { path = "../../crates/contracts" }
ait-domain = { path = "../../crates/domain" }
serde = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
ait-api-http = { path = "../../crates/api-http" }
ait-application = { path = "../../crates/application" }
ait-ports = { path = "../../crates/ports" }
ait-storage-sqlite = { path = "../../crates/storage-sqlite" }
async-trait = "0.1"
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["net", "process", "sync", "time"] }

[lints]
workspace = true
