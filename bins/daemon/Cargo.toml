[package]
name = "ait-daemon"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
dev-mock-provider = [
    "ait-api-http/dev-mock-provider",
    "ait-application/dev-mock-provider",
]

[dependencies]
ait-tools = { path = "../../crates/tools" }
ait-agent-adapters = { path = "../../crates/agent-adapters" }
ait-application = { path = "../../crates/application" }
ait-api-http = { path = "../../crates/api-http" }
ait-domain = { path = "../../crates/domain" }
ait-ipc = { path = "../../crates/ipc" }
ait-observability = { path = "../../crates/observability" }
ait-project-local = { path = "../../crates/project-local" }
ait-ports = { path = "../../crates/ports" }
ait-storage-sqlite = { path = "../../crates/storage-sqlite" }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
ait-contracts = { path = "../../crates/contracts" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
