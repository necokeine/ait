[package]
name = "server-bin"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
server-terminal = { version = "0.0.6", path = "../../crates/server-terminal" }
server-provider = { version = "0.0.6", path = "../../crates/server-provider" }
server-filesystem = { version = "0.0.6", path = "../../crates/server-filesystem" }
server-metadata = { version = "0.0.6", path = "../../crates/server-metadata" }
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
server-api = { path = "../../crates/server-api" }
server-domain = { version = "0.0.6", path = "../../crates/server-domain" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.0", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1.0.151"
server-protocol = { path = "../../crates/server-protocol" }
tokio-tungstenite = "0.29"
