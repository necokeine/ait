[package]
name = "ait-worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ait-contracts = { path = "../../crates/contracts" }
async-trait = "0.1"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
ait-agent-adapters = { path = "../../crates/agent-adapters" }
ait-domain = { path = "../../crates/domain" }
ait-ipc = { path = "../../crates/ipc" }
ait-ports = { path = "../../crates/ports" }
ait-providers = { path = "../../crates/providers" }
ait-runtime = { path = "../../crates/runtime" }
ait-sandbox = { path = "../../crates/sandbox" }
ait-tools = { path = "../../crates/tools" }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
ait-application = { path = "../../crates/application" }
ait-storage-sqlite = { path = "../../crates/storage-sqlite" }
axum = "0.8"
tempfile = "3"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
