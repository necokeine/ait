appId: dev.ait.desktop
productName: Ait
asar: true

directories:
  output: release

files:
  - dist/**/*
  - package.json

extraResources:
  - from: release-resources/bin/ait-daemon
    to: bin/ait-daemon
  - from: release-resources/bin/ait-worker
    to: bin/ait-worker

mac:
  icon: ../../logo.svg
  category: public.app-category.developer-tools
  artifactName: Ait-${version}-macos-arm64.${ext}
  target:
    - dmg
    - zip

linux:
  icon: ../../logo.png
  category: Development
  executableName: ait-desktop
  synopsis: Local-first multi-agent desktop workspace
  artifactName: Ait-${version}-linux-x86_64.${ext}
  target:
    - AppImage
    - tar.gz
