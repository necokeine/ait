[package]
name = "ait-ipc"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ait-contracts = { path = "../contracts" }
ait-domain = { path = "../domain" }
ait-ports = { path = "../ports" }
ait-sandbox = { path = "../sandbox" }
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "io-std", "process", "rt", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
