[package]
name = "ait-api-http"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
dev-mock-provider = [
    "ait-application/dev-mock-provider",
    "ait-contracts/dev-mock-provider",
    "ait-domain/dev-mock-provider",
]

[dependencies]
ait-application = { path = "../application" }
ait-contracts = { path = "../contracts" }
ait-domain = { path = "../domain" }
ait-observability = { path = "../observability" }
axum = "0.8"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = "0.1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
ait-agent-adapters = { path = "../agent-adapters" }
ait-ports = { path = "../ports" }
async-trait = "0.1"
futures-util = "0.3"
ait-project-local = { path = "../project-local" }
ait-storage-sqlite = { path = "../storage-sqlite" }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
