[package]
name = "ait-api-http"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ait-application = { path = "../application" }
ait-contracts = { path = "../contracts" }
ait-domain = { path = "../domain" }
ait-observability = { path = "../observability" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = "0.1"

[dev-dependencies]
ait-storage-sqlite = { path = "../storage-sqlite" }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
