[package]
name = "ait-application"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ait-contracts = { path = "../contracts" }
ait-domain = { path = "../domain" }
ait-ports = { path = "../ports" }
ait-runtime = { path = "../runtime" }
ait-scheduler = { path = "../scheduler" }
sha2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ait-storage-sqlite = { path = "../storage-sqlite" }
criterion = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "message_path"
harness = false

[lints]
workspace = true
