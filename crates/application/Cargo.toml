[package]
name = "ait-application"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
dev-mock-provider = [
    "ait-contracts/dev-mock-provider",
    "ait-domain/dev-mock-provider",
]

[dependencies]
ait-contracts = { path = "../contracts" }
ait-domain = { path = "../domain" }
ait-ports = { path = "../ports" }
ait-runtime = { path = "../runtime" }
ait-scheduler = { path = "../scheduler" }
async-trait = "0.1"
futures-util = "0.3"
sha2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
tokio-util = { version = "0.7", features = ["rt"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
ait-agent-adapters = { path = "../agent-adapters" }
ait-storage-sqlite = { path = "../storage-sqlite" }
criterion = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "message_path"
harness = false

[lints]
workspace = true
