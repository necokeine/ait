[package]
name = "ait-workspace-local"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ait-domain = { path = "../domain" }
ait-workspace = { path = "../workspace" }
dirs = "6"
same-file = "1"
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[dev-dependencies]
ait-ports = { path = "../ports" }
ait-workspace = { path = "../workspace", features = ["contract-tests"] }
ait-contracts = { path = "../contracts" }
ait-storage-sqlite = { path = "../storage-sqlite" }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ait-application = { path = "../application" }
tempfile = "3"

[lints]
workspace = true
