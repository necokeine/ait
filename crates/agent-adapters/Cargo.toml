[package]
name = "ait-agent-adapters"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ait-domain = { path = "../domain" }
ait-ports = { path = "../ports" }
ait-tools = { path = "../tools" }
async-trait = "0.1"
bytes = "1"
futures-core = "0.3"
keyring = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rig = { package = "rig-core", version = "0.42", default-features = false, features = ["reqwest", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(any(target_os = "linux", target_vendor = "apple"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
