[package]
name = "server-provider"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Validate image payloads before native prompt admission and decode provider image artifacts.
base64 = "0.22.1"
# Read-only Claude OAuth quota inspection; credentials never enter public snapshots.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
secrecy = "0.10.3"
server-model = { version = "0.0.6", path = "../server-model" }
server-domain = { version = "0.0.6", path = "../server-domain" }
server-metadata = { version = "0.0.6", path = "../server-metadata" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "process", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
uuid = { version = "1.26.0", features = ["v4"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Match Claude Agent SDK's NFC normalization of native session directory names.
unicode-normalization = "0.1.24"
