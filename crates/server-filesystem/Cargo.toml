[package]
name = "server-filesystem"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Project/Workspace registries and consumer-owned provisioning contracts.
server-metadata = { version = "0.0.6", path = "../server-metadata" }
base64 = "0.22.1"
chrono = "0.4.42"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
uuid = { version = "1.22.0", features = ["v4"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[lints]
workspace = true
