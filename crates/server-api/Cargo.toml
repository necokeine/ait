[package]
name = "server-api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
server-provider = { version = "0.0.6", path = "../server-provider" }
server-filesystem = { version = "0.0.6", path = "../server-filesystem" }
server-metadata = { version = "0.0.6", path = "../server-metadata" }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
secrecy = "0.10.3"
serde = "1.0.229"
serde_json = "1.0.151"
server-protocol = { path = "../server-protocol" }
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower-http = { version = "0.6", features = ["trace", "timeout"] }
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"
