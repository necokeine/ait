[package]
name = "ait-tools"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ait-domain = { path = "../domain" }
ait-ports = { path = "../ports" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

async-trait = "0.1"
cap-std = "4.0"
cap-fs-ext = "4.0"
libc = "0.2"
regex = "1"
globset = "0.4"
process-wrap = { version = "10", features = ["tokio1"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "net", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

jsonschema = { version = "0.33", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
