[package]
name = "server-storage"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
getrandom = "0.4.3"
indexmap = "2.14.2"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
server-domain = { version = "0.0.6", path = "../server-domain" }
server-ports = { version = "0.0.6", path = "../server-ports" }

[lints]
workspace = true
